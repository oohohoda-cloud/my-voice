function openDB(){return new Promise((resolve,reject)=>{try{const r=indexedDB.open('my_voice_soundboard',2);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('clips'))r.result.createObjectStore('clips',{keyPath:'id'});if(!r.result.objectStoreNames.contains('settings'))r.result.createObjectStore('settings');};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(new Error('저장소가 잠겨 있습니다.'));}catch(e){reject(e);}});}

async function importClip(clip,file){
  if(!file||!ready||busy||recording)return;

    const ext=(file.name.split('.').pop()||'').toLowerCase();
    const types={m4a:'audio/mp4',mp3:'audio/mpeg',wav:'audio/wav',aac:'audio/aac',ogg:'audio/ogg',opus:'audio/ogg',webm:'audio/webm',flac:'audio/flac','3ga':'audio/3gpp','3gp':'audio/3gpp',amr:'audio/amr',mp4:'audio/mp4'};

async function toggleRecord(clip){

  stopPlayback();busy=true;refresh();say('마이크 사용 권한을 확인하는 중...');let stream;let stage='마이크 접근';

        if(db){await save({...clip,blob});clip.blob=blob;say(clip.label+' 녹음 저장 완료');}else{clip.blob=blob;say('녹음 완료. 자동 저장 불가: 현재 화면에서만 유지됩니다.');}

}
async function rename(clip){if(!ready||busy||recording)return;const value=prompt('버튼 이름을 입력하세요.',clip.label);if(value===null||!value.trim())return;const label=value.trim().slice(0,40);busy=true;refresh();try{if(db)await save({...clip,label});clip.label=label;say(db?'버튼 이름 저장 완료':'이름 변경 완료. 현재 화면에서만 유지됩니다.');}catch(e){say('이름 저장 실패. 기존 이름은 유지됩니다.');}finally{busy=false;refresh();}}
for(const clip of clips){const slot=document.createElement('div');slot.className='slot';const play=document.createElement('button');play.type='button';play.className='voice';const label=document.createElement('span');const info=document.createElement('small');play.append(label,info);const actions=document.createElement('div');actions.className='actions';const rec=document.createElement('button');rec.type='button';rec.className='rec';const name=document.createElement('button');name.type='button';name.className='rename';name.textContent='이름 변경';const imp=document.createElement('button');imp.type='button';imp.className='import';imp.textContent='파일 등록';const input=document.createElement('input');input.type='file';input.accept='audio/*,.m4a,.mp3,.wav,.aac,.3ga,.3gp,.amr';input.hidden=true;actions.append(rec,imp,name);slot.append(play,actions,input);grid.append(slot);views.push({slot,actions,play,label,info,rec,rename:name,import:imp});play.onclick=()=>playClip(clip);rec.onclick=()=>toggleRecord(clip);name.onclick=()=>rename(clip);imp.onclick=()=>{input.value='';input.click();};input.onchange=()=>{const file=input.files&&input.files[0];if(file)importClip(clip,file);input.value='';};}

function validNames(a){return Array.isArray(a)&&a.length===3&&a.every(x=>typeof x==='string'&&x.trim()&&x.length<=24);}
function loadSettings(){return new Promise((resolve,reject)=>{const r=db.transaction('settings','readonly').objectStore('settings').get('tabs');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function saveSettings(names){return new Promise((resolve,reject)=>{if(!db)return reject(new Error('저장소 사용 불가'));const tx=db.transaction('settings','readwrite');tx.oncomplete=resolve;tx.onerror=tx.onabort=()=>reject(tx.error);tx.objectStore('settings').put(names,'tabs');});}
function blobToData(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob);});}
backupBtn.onclick=async()=>{if(!db||busy||recording)return;busy=true;refresh();say('백업 만드는 중...');try{const data={format:'my-voice-backup-v1',tabs:tabNames,clips:[]};for(const c of clips)data.clips.push({id:c.id,label:c.label,data:c.blob?await blobToData(c.blob):null});const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my_voice_backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);say('백업 파일 다운로드 요청 완료');}catch(e){say('백업 실패: '+e.message);}finally{busy=false;refresh();}};
restoreBtn.onclick=()=>{if(!busy&&!recording){restoreInput.value='';restoreInput.click();}};
restoreInput.onchange=async()=>{const file=restoreInput.files?.[0];restoreInput.value='';if(!file||busy||recording||!db)return;if(!confirm('백업으로 현재 18개 음성과 이름을 모두 교체할까요?'))return;stopPlayback();busy=true;refresh();say('백업 복원 중...');try{
 if(file.size>150*1024*1024)throw new Error('백업 파일이 너무 큽니다.');const data=JSON.parse(await file.text());if(data.format!=='my-voice-backup-v1'||!validNames(data.tabs)||!Array.isArray(data.clips)||data.clips.length!==18)throw new Error('지원하지 않는 백업 파일');const next=[];
 for(let i=0;i<18;i++){const c=data.clips[i];if(c.id!==i||typeof c.label!=='string'||!c.label.trim()||c.label.length>40)throw new Error('잘못된 음성 정보');let blob=null;if(c.data!==null){if(typeof c.data!=='string'||!/^data:(?:audio\/[^;,]+|application\/octet-stream|video\/[^;,]+)?(?:;[^;,]+)*;base64,/i.test(c.data))throw new Error('잘못된 녹음 데이터');const j=c.data.indexOf(',');const type=c.data.slice(5,j-7);const raw=atob(c.data.slice(j+1));const bytes=Uint8Array.from(raw,x=>x.charCodeAt(0));if(!bytes.length)throw new Error('빈 녹음 데이터');blob=new Blob([bytes],{type});}next.push({id:i,label:c.label,blob});}

 next.forEach((c,i)=>Object.assign(clips[i],c));tabNames=data.tabs;say('복원 완료');
 }catch(e){say('복원 실패. 기존 데이터 유지: '+e.message);}finally{busy=false;refresh();}};
function updateWake(){wakeBtn.setAttribute('aria-pressed',String(wantWake));wakeBtn.textContent=wantWake?'화면 유지 ON':'화면 유지 OFF';wakeBtn.classList.toggle('on',wantWake);if(!wantWake)wakeStatus.textContent='휴대폰 기본 잠금 설정 적용';else if(wake&&!wake.released)wakeStatus.textContent='화면 켜짐 유지 중';else if(wakePending)wakeStatus.textContent='화면 유지 요청 중';}
